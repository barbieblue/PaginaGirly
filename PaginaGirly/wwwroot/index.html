<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SubastaYa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/estilos.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar mb-4">
        <div class="container">
            <a href="index.html" class="navbar-brand mb-0 h1">🔨 SubastaYa</a>
            <div class="d-flex gap-2">
                <a href="misactividades.html" class="btn btn-outline-light btn-sm">📋 Mis actividades</a>
                <a href="billetera.html" class="btn btn-outline-light btn-sm">💰 Billetera</a>
                <a href="publicar.html" class="btn btn-outline-light btn-sm">+ Publicar subasta</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <h2 class="mb-3">Catálogo de Subastas</h2>

        <div class="row mb-4 g-2">
            <div class="col-md-3">
                <select id="filtroEstado" class="form-select">
                    <option value="">Todos los estados</option>
                    <option value="ACTIVA">Activas</option>
                    <option value="PROGRAMADA">Próximas</option>
                    <option value="FINALIZADA">Finalizadas</option>
                    <option value="DESIERTA">Desiertas</option>
                </select>
            </div>
            <div class="col-md-3">
                <select id="filtroCategoria" class="form-select">
                    <option value="">Todas las categorías</option>
                </select>
            </div>
        </div>

        <div id="contenedorSubastas" class="row g-3"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/catalogo.js"></script>
</body>
</html>
