<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SubastaYa - Publicar Subasta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/estilos.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <a href="index.html" class="navbar-brand mb-0 h1">🔨 SubastaYa</a>
            <div class="d-flex gap-2">
                <a href="billetera.html" class="btn btn-outline-light btn-sm">💰 Billetera</a>
                <a href="publicar.html" class="btn btn-outline-light btn-sm">+ Publicar subasta</a>
            </div>
        </div>
    </nav>

    <div class="container" style="max-width: 680px;">
        <h2 class="mb-4">Publicar subasta</h2>

        <div id="alertaError" class="alert alert-danger d-none"></div>
        <div id="alertaExito" class="alert alert-success d-none"></div>

        <div class="mb-3">
            <label class="form-label">Vendedor</label>
            <select id="selectVendedor" class="form-select">
                <option value="">Elegí un usuario...</option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Título</label>
            <input type="text" id="inputTitulo" class="form-control" placeholder="Ej: Notebook Gamer i7">
        </div>

        <div class="mb-3">
            <label class="form-label">Descripción</label>
            <textarea id="inputDescripcion" class="form-control" rows="3" placeholder="Describí el producto..."></textarea>
        </div>

        <div class="mb-3">
            <label class="form-label">URL de imagen <span class="text-muted">(opcional)</span></label>
            <input type="text" id="inputImagen" class="form-control" placeholder="https://...">
        </div>

        <div class="mb-3">
            <label class="form-label">Categoría</label>
            <select id="selectCategoria" class="form-select">
                <option value="">Elegí una categoría...</option>
            </select>
        </div>

        <div class="row g-3 mb-3">
            <div class="col-md-6">
                <label class="form-label">Precio base ($)</label>
                <input type="number" id="inputPrecioBase" class="form-control" min="1" placeholder="Ej: 10000">
            </div>
            <div class="col-md-6">
                <label class="form-label">Incremento mínimo ($)</label>
                <input type="number" id="inputIncremento" class="form-control" min="1" placeholder="Ej: 1000">
            </div>
        </div>

        <div class="row g-3 mb-4">
            <div class="col-md-6">
                <label class="form-label">Fecha y hora de inicio</label>
                <input type="datetime-local" id="inputFechaInicio" class="form-control">
            </div>
            <div class="col-md-6">
                <label class="form-label">Fecha y hora de cierre</label>
                <input type="datetime-local" id="inputFechaFin" class="form-control">
            </div>
        </div>

        <div class="d-flex gap-2">
            <button id="btnPublicar" class="btn btn-primary">Publicar subasta</button>
            <a href="index.html" class="btn btn-outline-secondary">Cancelar</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/publicar.js"></script>
</body>
</html>
