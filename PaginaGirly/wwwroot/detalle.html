<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SubastaYa - Detalle</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/estilos.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <a href="index.html" class="navbar-brand mb-0 h1">🔨 SubastaYa</a>
        </div>
    </nav>

    <div class="container" id="contenedorDetalle">
        <p class="text-muted">Cargando subasta...</p>
    </div>

    <!-- Toast para feedback (Módulo 3: "Mensajes visuales claros") -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="toastFeedback" class="toast" role="alert">
            <div class="toast-header">
                <strong class="me-auto" id="toastTitulo">Aviso</strong>
                <button type="button" class="btn-close" data-bs-dismiss="toast"></button>
            </div>
            <div class="toast-body" id="toastMensaje"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/detalle.js"></script>
</body>
</html>
