<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SubastaYa - Mis Actividades</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/estilos.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar mb-4">
        <div class="container">
            <a href="index.html" class="navbar-brand mb-0 h1">🔨 SubastaYa</a>
            <div class="d-flex gap-2">
                <a href="misactividades.html" class="btn btn-outline-light btn-sm">📋 Mis actividades</a>
                <a href="billetera.html" class="btn btn-outline-light btn-sm">💰 Billetera</a>
                <a href="publicar.html" class="btn btn-outline-light btn-sm">+ Publicar subasta</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <h2 class="mb-4">Mis actividades</h2>

        <div class="mb-4" style="max-width: 400px;">
            <label class="form-label">Ver actividades de:</label>
            <select id="selectUsuario" class="form-select">
                <option value="">Elegí un usuario...</option>
            </select>
        </div>

        <div id="panelActividades" class="d-none">
            <ul class="nav nav-tabs mb-4" id="tabActividades">
                <li class="nav-item">
                    <button class="nav-link active" id="tabPujas" data-tab="pujas">Mis Pujas</button>
                </li>
                <li class="nav-item">
                    <button class="nav-link" id="tabPublicaciones" data-tab="publicaciones">Mis Publicaciones</button>
                </li>
            </ul>

            <div id="contenidoPujas"></div>
            <div id="contenidoPublicaciones" class="d-none"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/misactividades.js"></script>
</body>
</html>
